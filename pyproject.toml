[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-ml"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "mlflow>=3,<4",
    "pandas>=2.2,<3",
    "pyyaml>=6,<7",
    "scikit-learn>=1.5,<2",
    "seaborn>=0.13,<1",
    "tabulate>=0.9,<1",
    "uvicorn>=0.34,<1",
    "xgboost>=3,<4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[project.scripts]
churn-train = "train_model:cli"
churn-api = "src.api:run"
churn-eda = "generate_eda_report:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["train_model", "generate_eda_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
